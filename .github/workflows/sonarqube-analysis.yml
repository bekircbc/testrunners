name: SonarQube Quality & Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  sonarqube-analysis:
    name: SonarQube Analysis & OWASP Scanning
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout codebase with full git history for accurate blame/line-level reporting
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones disable SonarQube line-by-line blame analysis

      # Step 2: Set up Node.js environment
      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run unit/integration tests and generate LCOV coverage report for SonarQube
      - name: Run Vitest with LCOV Coverage
        run: npm run test:unit -- --coverage.reporter=lcov

      # Step 5: Execute SonarQube Scanner for SAST & OWASP Top 10 detection
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2.0.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Step 6: Wait for Quality Gate check (Fails build if OWASP/Quality thresholds fail)
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
