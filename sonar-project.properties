# Project Metadata
sonar.projectKey=testrunners
sonar.projectName=Next.js Enterprise Application
sonar.language=js

# Source and Test Code Paths
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx
sonar.exclusions=node_modules/**,.next/**,coverage/**,public/**

# Vitest Coverage Integration
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# OWASP Top 10 & Security Rules Configuration
sonar.security.enable=true
sonar.issue.ignore.multicriteria=e1
# False-positive durumları için kural muafiyetleri buraya eklenir
